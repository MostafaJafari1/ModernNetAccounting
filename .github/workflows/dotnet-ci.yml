name: .NET Core CI

on:
  push:
    branches: [ "main", "develop" ] # تست‌ها هنگام پوش به این برنچ‌ها اجرا می‌شوند
  pull_request:
    branches: [ "main" ] # تست‌ها هنگام ایجاد PR به سمت main اجرا می‌شوند

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x 

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --verbosity normal